version: 2

updates:
  # npm / pnpm dependencies across the whole workspace (root + frontend + backend).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Supply-chain cooldown: never adopt a version until it has been published
    # for at least 7 days. Guards against freshly-published compromised releases.
    cooldown:
      default-days: 7
    # `typescript` stays on 6.x for typescript-eslint; TS 7 comes in as
    # `@typescript/native` — see docs/arc42 §9 ADR 18.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
